<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Confluence Markdown Viewer</title>
<script>
/* Settle the theme before the first paint. The "Loading..." text and the page
   background are painted as soon as the stylesheet applies, which is well before
   js/viewer.js runs - it waits on three libs - so a reader whose theme is dark
   would otherwise see a white flash. That cannot be fixed in the stylesheet
   alone: a saved preference, ?theme=, or the embedding page can disagree with
   the OS, and CSS can read none of them. This is a plain inline script in the
   head for that reason; it must stay inline and must stay above the stylesheet.

   Precedence, highest first - the same order viewer.js and the embedding page
   use, so all three settle on one answer:
     1. ?theme=            an explicit override, wins over everything
     2. mdv-theme          the reader's own toggle, persisted
     3. Mdv-Theme-Prefers  the embedding page's background, put in the src by the
                           embed snippet before this iframe existed. Lowest,
                           because it is a guess the page makes on the reader's
                           behalf; it only fills the gap before the page's
                           postMessage arrives with the real colours.

   A value here is a first-paint hint, never a lock: viewer.js does not read
   Mdv-Theme-Prefers at all, so themeMode stays 'auto' and the embed's
   postMessage still corrects a wrong guess without a visible flip, and a toggle
   click overwrites both the attribute and localStorage. */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    var p = q.get('theme');
    var t = p === 'light' || p === 'dark' || p === 'auto' ? p : null;
    if (!t) t = localStorage.getItem('mdv-theme');
    if (!t) t = q.get('Mdv-Theme-Prefers');   /* capitalised: not part of the API */
    if (t === 'auto') t = null;               /* auto follows the OS, so no attribute */
    if (t !== 'light' && t !== 'dark') return;
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
  } catch (e) { /* storage blocked: fall through to the media query */ }
})();
</script>
<link rel="stylesheet" href="css/viewer.css">
</head>
<body>
<div id="content" class="markdown-body">Loading&hellip;</div>
<button id="theme-toggle" type="button" aria-label="Theme"></button>
<!-- Vendored, not CDN: this viewer runs on an internal host, and three
     cross-origin script fetches delayed the first render by the round-trip cost
     of each. Mermaid stays on the CDN (1MB, lazy, only docs with a diagram). -->
<script src="lib/marked.min.js"></script>
<script src="lib/marked-gfm-heading-id.min.js"></script>
<script src="lib/highlight.min.js"></script>
<script src="js/viewer.js"></script>
</body>
</html>
